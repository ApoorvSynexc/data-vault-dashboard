name: Deploy DEV to EC2

on:
  push:
    branches:
      - DEV

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      VITE_API_URL: ${{ secrets.VITE_API_URL }}
      VITE_ENV: DEV
      WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}

    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy via SSH
        id: deploy_step
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
          "VITE_API_URL='${{ secrets.VITE_API_URL }}' \
          VITE_ENV='DEV' \
          bash -s" << 'EOF'

            echo "🔧 Loading NVM..."

            export NVM_DIR="$HOME/.nvm"

            # Load nvm
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            [ -s "$NVM_DIR/bash_completion" ] && \. "$NVM_DIR/bash_completion"
            
            set -euo pipefail

            cd /var/www/DataVault-Frontend-App

            echo "📥 Pulling latest code..."
            git fetch origin
            git checkout DEV
            git pull origin DEV

            echo "🧹 Cleaning old .env..."
            rm -f .env

            echo "⚙️ Generating fresh .env..."

            echo "VITE_API_URL=$VITE_API_URL" > .env
            echo "VITE_ENV=$VITE_ENV" >> .env

            echo "🔧 Ensuring Node is available..."

            export PATH=$PATH:/usr/bin:/usr/local/bin

            if ! command -v npm &> /dev/null; then
              echo "❌ npm not found. Please install Node.js on EC2"
              exit 1
            fi
            
            echo "📦 Installing dependencies..."
            npm ci

            echo "🏗️ Building React app..."
            npm run build
            echo "✅ Deployment completed successfully!"
          EOF

      # ✅ SUCCESS WEBHOOK
      - name: Notify Success
        if: success()
        run: |
          curl -X POST "$WEBHOOK_URL" \
          -H "Content-Type: application/json" \
          -d '{"text":"<h1>✅ Code Successfully Deployed to Dev - DataVault-Frontend-App</h1>"}'

      - name: Notify Failure
        if: failure()
        run: |
          curl -X POST "$WEBHOOK_URL" \
          -H "Content-Type: application/json" \
          -d '{"text":"<h1>❌ Error in code deployment to Dev - DataVault-Frontend-App</h1>"}'